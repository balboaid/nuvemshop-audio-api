<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Antonio:wght@100..700&family=Roboto+Slab:wght@100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Preview Panel - DJ Vinyl Store</title>
    <style>
      body { font-family: "Roboto", sans-serif; background: #f3f3f3; padding: 20px; }
      .card { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 4px rgb(0 0 0 / 0.1); }
      input { padding: 10px; margin: 6px 0; width: 100%; box-sizing: border-box; border: 1px solid #858585; border-radius: 4px; }
      button { background: black; color: white; border-radius: 4px; font-weight: 700; cursor: pointer; border: none; padding: 10px 30px; margin: 6px 0; }
      table { width: 100%; border-collapse: collapse; margin-top: 15px; }
      td, th { border: 1px solid #ddd; padding: 8px; }
      th { background: #adadad; color: white; font-size: 12px; font-weight: 400; }
      h3 { font-weight: 500; margin-bottom: 5px; }
    </style>
  </head>

  <body>
  <h1>Preview Panel</h1>
  <h2>DJ Vinyl Store</h2>

  <div class="card">
    <h3>Configuration</h3>
    <input id="apiKey" type="password" placeholder="Enter the DJ Vinyl Store System Password (X-API-Key)" />
    <input id="productId" type="text" placeholder="Paste the PRODUCT_ID for the music in the Catalog" />
    <button onclick="loadPreviews()">Load Previews</button>
  </div>

  <div class="card">
    <h3>Preview List</h3>
    <table id="previewTable">
      <thead>
        <tr>
          <th>ID</th>
          <th>Audio</th>
          <th>Title</th>
          <th>Track</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="card">
    <h3>Create Preview</h3>
    <input id="newAudio" type="text" placeholder="MP3 Link (URL) (paste here)" />
    <input id="newTitle" type="text" placeholder="Track Title" />
    <input id="newTrack" type="number" placeholder="Track Number" />
    <button onclick="createPreview()">Create Track Preview</button>
  </div>

    <script>
const BASE = window.location.origin;

async function loadPreviews() {
  const productId = document.getElementById("productId").value;
  if (!productId) return alert("Enter the product_id");

  const res = await fetch(`${BASE}/api/previews?product_id=${productId}`);
  const data = await res.json();

  console.log("API Response:", data);

  const tbody = document.querySelector("#previewTable tbody");
  tbody.innerHTML = "";

  // ❗ Main adjustment: data is an array, not an object {previews:[]}
  data.forEach(p => {
    const row = document.createElement("tr");
    row.innerHTML = `
      <td>${p.id}</td>
      <td>${p.audio_url}</td>
      <td>${p.title || ""}</td>
      <td>${p.track_number || ""}</td>
      <td>
        <button onclick="deletePreview(${p.id})">Delete</button>
      </td>
    `;
    tbody.appendChild(row);
        });
}

async function createPreview() {
  const productId = document.getElementById("productId").value;
  const apiKey = document.getElementById("apiKey").value;

  const audio = document.getElementById("newAudio").value;
  const title = document.getElementById("newTitle").value;
  const track = document.getElementById("newTrack").value;

  const body = {
    product_id: productId,
    audio_url: audio,
    title,
    track_number: track ? Number(track) : null
  };

  const res = await fetch(`${BASE}/api/previews`, {
          method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": apiKey
    },
    body: JSON.stringify(body)
  });

  if (!res.ok) {
    const txt = await res.text();
    alert("Error creating: " + txt);
  return;
}

  alert("Created successfully!");
  loadPreviews();
}

async function deletePreview(id) {
  const apiKey = document.getElementById("apiKey").value;

  const res = await fetch(`${BASE}/api/previews/${id}`, {
    method: "DELETE",
    headers: {
      "x-api-key": apiKey
    }
  });

  if (res.status !== 200) return alert("Error deleting");

  alert("Removed!");
  loadPreviews();
}
    </script>

    <div>
      <hr />
      <p style="font-size: x-small;">&copy; 2025/2026 Developed by <a href="https://amodisco30.lojavirtualnuvem.com.br/" target="_blank" style="color: black">DJ Vinyl Store</a> and <a href="https://miguelnwafor.com.br" target="_blank" style="color: black">Miguel Fredman Nwafor (Dev)</a></p>
    </div>

  </body>
</html>
